<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابات فري فاير</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .chat-box { position:fixed; inset:0; background:#0f172a; z-index:2000; display:none; flex-direction:column; }
    .chat-header { background:#1e293b; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .chat-msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; }
    .msg { max-width:80%; padding:10px 14px; border-radius:12px; margin-bottom:8px; word-break:break-word; }
    .msg.me { background:#f97316; color:#fff; align-self:flex-end; }
    .msg.other { background:#334155; align-self:flex-start; }
    .system-msg { align-self:center; background:#166534; color:#fff; padding:12px 20px; border-radius:20px; font-weight:700; margin:12px 0; }
    .chat-input { display:flex; padding:12px; gap:8px; background:#1e293b; }
    .chat-input input { flex:1; padding:12px; border-radius:20px; border:none; background:#0f172a; color:#fff; }
    .paid-banner { align-self:center; background:#22c55e; color:#fff; padding:14px 24px; border-radius:16px; font-weight:800; margin:16px 0; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  </style>
</head>
<body>
<header>
  <a href="index.html" style="color:#f97316; font-weight:700;">← رجوع</a>
  <h2 style="margin:0;">حسابات فري فاير</h2>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="msg-icon-wrap" onclick="openMessages()" title="الرسائل">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <span id="msgBadge" class="msg-badge" style="display:none;">0</span>
    </div>
    <a href="transactions.html" style="color:#94a3b8;">معاملاتي</a>
  </div>
</header>

<h1 class="section-title" style="margin-top:32px;">الباكات المتاحة</h1>
<div class="packs-container" id="packsContainer"></div>

<div id="chatBox" class="chat-box">
  <div class="chat-header">
    <div>
      <button id="cancelBtn" style="background:#ef4444; color:#fff; border:none; padding:8px 14px; border-radius:8px;">إلغاء الشراء</button>
      <button id="payBtn" style="background:#22c55e; color:#fff; border:none; padding:8px 14px; border-radius:8px; margin-right:8px;">تم الدفع</button>
    </div>
    <button id="exitBtn" onclick="leaveChat()" style="background:#334155; color:#fff; border:none; padding:8px 14px; border-radius:8px;">خروج</button>
  </div>
  <div id="chatMsgs" class="chat-msgs"></div>
  <div class="chat-input">
    <input id="msgInput" placeholder="اكتب رسالة..." />
    <button onclick="sendMsg()" style="background:#f97316; color:#fff; border:none; padding:10px 16px; border-radius:20px;">إرسال</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>window.SHOP_GAME = 'freefire';</script>
<script src="common.js"></script>
<script src="shop.js"></script>
<script>
  // ===== الشات (مسار التراستيد) — الشراء والدفع الوهمي والرسائل في shop.js =====
  let currentChatId = null;
  let currentPackId = null;
  let currentPackData = null;
  let unsubscribe = null;
  let chatStatusUnsub = null;
  let isPaid = false;

  async function startBuy(packId, packData) {
    if (isTrusted) {
      showToast('التراستيد مش بيشتري', 'error');
      return;
    }
    const check = await db.collection('active_chats').where('packId','==',packId).where('status','in',['waiting','active']).get();
    if (!check.empty) {
      showToast('الحساب ده في الشراء حالياً', 'error');
      return;
    }
    currentPackId = packId;
    currentPackData = packData;
    isPaid = false;
    const ref = await db.collection('active_chats').add({
      packId,
      status: 'waiting',
      buyerId: myId,
      packName: packData.packName || '',
      platform: packData.platform || '',
      email: packData.email || '',
      password: packData.password || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    currentChatId = ref.id;
    openChat();
    document.getElementById('chatMsgs').innerHTML = '<div class="system-msg">جاري انتظار الوسيط...</div>';
  }

  function openChat() {
    document.getElementById('chatBox').style.display = 'flex';
    if (unsubscribe) unsubscribe();
    if (chatStatusUnsub) chatStatusUnsub();

    unsubscribe = db.collection('active_chats').doc(currentChatId).collection('messages').orderBy('timestamp').onSnapshot(snap => {
      const box = document.getElementById('chatMsgs');
      box.innerHTML = '';
      snap.forEach(m => {
        const data = m.data();
        if (data.system) {
          box.innerHTML += `<div class="system-msg">${esc(data.text)}</div>`;
        } else {
          const cls = data.sender === myId ? 'me' : 'other';
          box.innerHTML += `<div class="msg ${cls}">${esc(data.text)}</div>`;
        }
      });
      box.scrollTop = box.scrollHeight;
    });

    // لا نغلق الشات تلقائياً عند حذف الوثيقة إلا لو المستخدم ضغط خروج
    chatStatusUnsub = db.collection('active_chats').doc(currentChatId).onSnapshot(d => {
      if (!d.exists && !isPaid) {
        // لو اتشال من غير دفع (إلغاء مثلاً) نطلع
        leaveChat(true);
      }
    });
  }

  async function sendMsg() {
    const text = document.getElementById('msgInput').value.trim();
    if (!text || !currentChatId) return;
    await db.collection('active_chats').doc(currentChatId).collection('messages').add({
      text, sender: myId, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('msgInput').value = '';
  }

  document.getElementById('payBtn').onclick = async () => {
    if (!currentChatId || isPaid) return;
    const buyerId = localStorage.getItem('userEmail') || localStorage.getItem('userName') || 'guest';
    const packName = (currentPackData && currentPackData.packName) || localStorage.getItem('joinPackName') || 'حساب فري فاير';
    const email = (currentPackData && currentPackData.email) || localStorage.getItem('joinPackEmail') || '';
    const password = (currentPackData && currentPackData.password) || localStorage.getItem('joinPackPassword') || '';
    const platform = (currentPackData && currentPackData.platform) || localStorage.getItem('joinPackPlatform') || '';

    isPaid = true;

    await db.collection('active_chats').doc(currentChatId).collection('messages').add({
      text: '✅ تم الدفع بنجاح — الحساب اتحفظ في معاملاتك',
      system: true,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    // حفظ المعاملة بشكل مضمون
    await db.collection('user_transactions').add({
      buyerId: buyerId,
      packName: packName,
      email: email,
      password: password,
      platform: platform,
      packId: currentPackId || '',
      status: 'completed',
      paidAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // حذف الباك من القائمة
    if (currentPackId) {
      try { await db.collection('freefire_packs').doc(currentPackId).delete(); } catch(e) {}
    }

    // تحديث حالة الشات بدل ما نمسحه فوراً — عشان محدش يتطرد
    try {
      await db.collection('active_chats').doc(currentChatId).update({ status: 'paid' });
    } catch(e) {}

    const box = document.getElementById('chatMsgs');
    box.innerHTML += '<div class="paid-banner">تم الدفع ✅ — اضغط خروج لما تخلص</div>';
    box.scrollTop = box.scrollHeight;

    showToast('تم الدفع! الحساب اتحفظ في معاملاتك', 'success');
    // لا نغلق الشات ولا نمسح الـ chat هنا — الخروج يدوي فقط
  };

  document.getElementById('cancelBtn').onclick = async () => {
    if (!currentChatId) return;
    if (!confirm('إلغاء الشراء وإرجاع الحساب؟')) return;
    isPaid = false;
    try { await db.collection('active_chats').doc(currentChatId).delete(); } catch(e) {}
    showToast('تم إلغاء الطلب والحساب رجع متاح', 'success');
    leaveChat(true);
  };

  async function leaveChat(force) {
    // أي طرف يقدر يطلع بالضغط على خروج
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (chatStatusUnsub) { chatStatusUnsub(); chatStatusUnsub = null; }

    // لو الدفع خلص نمسح الشات بعد ما يطلعوا
    if (currentChatId && isPaid) {
      try { await db.collection('active_chats').doc(currentChatId).delete(); } catch(e) {}
    }

    document.getElementById('chatBox').style.display = 'none';
    currentChatId = null;
    currentPackId = null;
    currentPackData = null;
    isPaid = false;
  }

  // Trusted: لا يدخل تلقائي — يدخل فقط لما يدوس اتصال من الصفحة الرئيسية
  if (isTrusted) {
    document.getElementById('cancelBtn').style.display = 'none';
    // التراستيد يقدر يضغط تم الدفع كمان لو عايز (أو نخفيه)
    // document.getElementById('payBtn').style.display = 'none';
  }

  window.onload = () => {
    // الدخول للشات فقط لو جاية من زرار "اتصال"
    const joinId = localStorage.getItem('joinChatId');
    if (joinId && isTrusted) {
      currentChatId = joinId;
      currentPackId = localStorage.getItem('joinPackId') || null;
      currentPackData = {
        packName: localStorage.getItem('joinPackName') || '',
        email: localStorage.getItem('joinPackEmail') || '',
        password: localStorage.getItem('joinPackPassword') || '',
        platform: localStorage.getItem('joinPackPlatform') || ''
      };
      localStorage.removeItem('joinChatId');
      localStorage.removeItem('joinPackId');
      localStorage.removeItem('joinPackName');
      localStorage.removeItem('joinPackEmail');
      localStorage.removeItem('joinPackPassword');
      localStorage.removeItem('joinPackPlatform');

      db.collection('active_chats').doc(currentChatId).update({ status: 'active', mediatorId: myId }).then(() => {
        openChat();
        db.collection('active_chats').doc(currentChatId).collection('messages').add({
          text: 'الوسيط دخل الشات',
          system: true,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).catch(() => {
        openChat();
      });
    }
  };

</script>
</body>
</html>
